name: Deriv Multiplier Trading Bot

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Trigger source"
        required: false
        default: "cronjob"
      mode:
        description: "Bot mode (scan, weekly, monthly, test, close_win, close_loss)"
        required: false
        default: "scan"

concurrency:
  group: deriv-bot-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          TRIGGER_SOURCE: ${{ github.event.inputs.source || 'cronjob' }}
          MODE: ${{ github.event.inputs.mode || 'scan' }}
        run: node alert.js

      - name: Commit state and trades update
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add state.json trades.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Auto update bot state and trade logs"
          for i in 1 2 3; do
            git pull --rebase -X ours origin main && git push origin HEAD:main && exit 0
            echo "Git push attempt $i failed. Retrying in 5s..."
            sleep 5
          done

          # Git-push-failure visibility alert
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            MSG=$'⚠️ *Git Persistence Alert — ${{ github.repository }}*\n\nGit push failed after 3 attempts. Local `state.json` and `trades.json` could not be synced back to GitHub main.\n\n• *Impact:* State and trade logs may be out of sync with actions executed on Deriv during this run.\n• *Self-Correction:* Server-truth reconciliation in alert.js will attempt auto-recovery on the next run, but verify manually if this persists.'
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="${MSG}" \
              -d parse_mode="Markdown"
          fi
          exit 1

      - name: Alert Telegram on Workflow Failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="⚠️ *Workflow Failure Alert — ${{ github.repository }}*\n\nA step failed during execution. Check GitHub Actions logs." \
              -d parse_mode="Markdown"
          fi